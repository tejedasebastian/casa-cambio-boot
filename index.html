<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name='description' content='Conversor de divisas con jQuery, Bootstrap y una API pública sin clave.'>
    <meta name='theme-color' content='#1B2E15'>
    <title>Casa de cambio | Conversor de divisas</title>

    <link rel="icon" type="image/x-icon" href="dinero.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Quicksand:wght@500&family=Rubik+Dirt&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <header class="bienvenida">
        <h1 class="textoBienvenida">Casa de Cambio 2024</h1>
    </header>
    <main>
        <section class="selectorMoneda" aria-labelledby="tituloSelector">
            <h2 id="tituloSelector" class="visually-hidden">Conversor de divisas</h2>
            <form id="formConversion" class="contenedorSelector" novalidate>
                <div class="filaSelector row">
                    <div class="moneda col-12 col-md-6">
                        <label for="selectMoneda" class="visually-hidden">Moneda de origen</label>
                        <select name="moneda" id="selectMoneda" aria-describedby="estadoApi" disabled>
                            <option value="">Cargando monedas…</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6 d-flex justify-content-center align-items-center">
                        <button type="submit" id="botonCambiar" class="btn btn-primary botonCambiar" disabled>Ver conversiones</button>
                    </div>
                </div>
                <div class="filaSelector row">
                    <div class="col-12 col-md-6">
                        <label for="numeroCalcular" class="textoCantidad">Ingresa una cantidad que quieras convertir</label>
                    </div>
                    <div class="boton-inicio col-12 col-md-6">
                        <input class="numeroCalcular" type="number" min="0" step="0.01" inputmode="decimal" value="1" id="numeroCalcular" autocomplete="off" disabled/>
                    </div>
                </div>
                <div class="filaEstado">
                    <p id="estadoApi" class="estado-api" role="status" aria-live="polite">Cargando monedas…</p>
                    <button type="button" id="reintentarMonedas" class="btn btn-outline-primary btn-sm reintentar oculto">Reintentar</button>
                </div>
            </form>
        </section>
        <section class="informacionPagina">
            <div class="filaSelector row align-items-center">
                <div class="col-12 col-md-6">
                    <p class="textoInformativo">Obten información actualizada sobre las monedas de diferentes países.</p>
                </div>
                <div class="col-12 col-md-6">
                    <i class="iconoCasa bi bi-currency-exchange" aria-hidden="true"></i>
                </div>
            </div>
        </section>
        <section class="espacioMonedas" aria-label="Conversiones">
            <div class="filaMonedas row" role="list"></div>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src='main.js'></script>
    <script src='casadecambio-jquery.js'></script>
</body>
</html>
